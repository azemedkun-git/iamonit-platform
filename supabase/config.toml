# Repository-local Supabase CLI configuration for development only.
project_id = "iamonit-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

# The Supabase CLI discovers migration files in supabase/migrations by default.
[db.migrations]
enabled = true
schema_paths = []

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
